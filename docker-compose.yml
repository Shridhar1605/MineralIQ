services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mineraliq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mineraliq}
      POSTGRES_DB: ${POSTGRES_DB:-mineraliq}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema_v1.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineraliq"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stage 1: only db is required for the s1 gate. Graph + search are
  # descoping-ladder steps 1-2: uncomment when memory allows (>6GB free).
  # neo4j:
  #   image: neo4j:5-community
  #   environment:
  #     NEO4J_AUTH: neo4j/mineraliq
  #   ports: ["7474:7474", "7687:7687"]
  #   volumes: [neo4jdata:/data]
  # opensearch:
  #   image: opensearchproject/opensearch:2
  #   environment:
  #     discovery.type: single-node
  #     OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
  #   ports: ["9200:9200"]
  #   volumes: [osdata:/usr/share/opensearch/data]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mineraliq}:${POSTGRES_PASSWORD:-mineraliq}@db:5432/${POSTGRES_DB:-mineraliq}
    ports:
      - "8000:8000"

volumes:
  pgdata:
  # neo4jdata:
  # osdata:
